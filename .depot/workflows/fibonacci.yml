name: Fibonacci calculation (Depot benchmark)

on:
  workflow_dispatch:
    inputs:
      n:
        description: 'Fibonacci index computed by this run'
        required: false
        default: '3'
      a:
        description: 'fib(n-2)'
        required: false
        default: '1'
      b:
        description: 'fib(n-1)'
        required: false
        default: '1'

jobs:
  fib:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Compute fib(n) and dispatch next run
        env:
          DEPOT_ORG_TOKEN: ${{ secrets.DEPOT_ORG_API_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          N: ${{ inputs.n }}
          A: ${{ inputs.a }}
          B: ${{ inputs.b }}
        run: |
          value=$((A + B))
          echo "fib($N) = $value"
          if [ "$N" -ge 20 ]; then
            echo "Done: fib(20) = $value"
            exit 0
          fi
          depot ci dispatch \
            --repo "$REPO" \
            --workflow fibonacci.yml \
            --ref "$REF" \
            --input "n=$((N + 1))" \
            --input "a=$B" \
            --input "b=$value"
            --token "$DEPOT_ORG_TOKEN"
