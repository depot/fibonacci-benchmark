name: Fibonacci calculation (Depot benchmark)

on:
  workflow_dispatch:
    inputs:
      n:
        description: 'Fibonacci index computed by this run'
        required: false
        default: '3'
      a:
        description: 'fib(n-2)'
        required: false
        default: '1'
      b:
        description: 'fib(n-1)'
        required: false
        default: '1'
      depth:
        description: 'Final fibonacci index to compute; the chain stops here'
        required: false
        default: '20'

jobs:
  fib:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Compute fib(n) and dispatch next run
        env:
          FIBONACCI_BENCHMARK_ORG_TOKEN: ${{ secrets.FIBONACCI_BENCHMARK_ORG_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          N: ${{ inputs.n }}
          A: ${{ inputs.a }}
          B: ${{ inputs.b }}
          DEPTH: ${{ inputs.depth }}
        run: |
          value=$((A + B))
          echo "fib($N) = $value"
          if [ "$N" -ge "$DEPTH" ]; then
            echo "Done: fib($DEPTH) = $value"
            exit 0
          fi
          depot ci dispatch \
            --repo "$REPO" \
            --workflow fibonacci.yml \
            --ref "$REF" \
            --input "n=$((N + 1))" \
            --input "a=$B" \
            --input "b=$value" \
            --input "depth=$DEPTH" \
            --token "$FIBONACCI_BENCHMARK_ORG_TOKEN"
